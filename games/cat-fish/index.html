<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cat & Fish Rhythm (試作)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <header>
    <h1>Cat & Fish Rhythm (試作)</h1>
    <div id="score">スコア: <span id="score-val">0</span></div>
    </header>

    <main>
      <div id="play-area">
        <div id="cat" class="character">
          <img src="images/cat.png" alt="cat">
        </div>
        <div id="feedback" aria-hidden="true"></div>
        <div id="bear" class="character">
          <img src="images/bear.png" alt="bear">
          <div class="judge-overlay" aria-hidden="true">
            <div class="judge-ring perfect"></div>
            <div class="judge-ring good"></div>
          </div>
        </div>
        <div id="fish-layer" aria-hidden="true"></div>
        <div id="hit-zone" class="hit-zone" aria-hidden="true"></div>
        <div id="turn-banner" class="turn-banner hidden" aria-hidden="true">準備中</div>
        <button id="tap-area" class="tap-area" aria-label="タップエリア">タップ!</button>
        <div id="judgement" class="judgement" aria-hidden="true"></div>
      </div>

      <div id="controls">
        <button id="start">スタート</button>
        <button id="restart">リスタート</button>

        <label for="difficulty">難易度:</label>
        <select id="difficulty">
          <option value="easy">Easy (60 BPM)</option>
          <option value="normal" selected>Normal (70 BPM)</option>
          <option value="hard">Hard (90 BPM)</option>
        </select>
        <label for="bpm-input">テンポ (BPM):</label>
        <input id="bpm-input" type="number" value="70" min="30" max="240" style="width:80px">

        <p>画面をタップ/クリックして魚を受け取らせよう。魚がクマに近づくとヒットゾーンが光ります。光ったとき（または魚が大きく見えたとき）にタップすると成功しやすいです。</p>
      </div>

    </main>
    <footer>
      <small>仮の画像と合成音声で動作する試作です。</small>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
