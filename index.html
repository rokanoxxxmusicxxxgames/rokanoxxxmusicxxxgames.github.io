<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ゲームセンター</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            text-align: center;
            padding: 50px 20px 30px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin-top: 15px;
            color: #666;
        }

        .games {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .game {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .game h2 {
            margin-top: 0;
        }

        .game p {
            color: #666;
        }

        .play-button {
            display: inline-block;
            padding: 10px 25px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .play-button:hover {
            background: #555;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎮 くだらないゲームセンター</h1>
        <p>暇つぶしにもならないゲームを集めています。</p>
    </header>

    <main class="games">

        <!-- 30秒モグラたたき -->
        <section class="game">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px;">
                <img src="games/click/images/mogura_normal.png" alt="モグラ" style="width: 42px; height: 42px; object-fit: contain;">
                <h2 style="margin: 0;">モグラたたき</h2>
            </div>

            <p>
                30秒間モグラ（画像）をたたいて、高得点を狙うゲーム
            </p>

            <a class="play-button" href="games/click/">
                遊ぶ
            </a>
        </section>

        <!--
        ゲームを追加するときはここに追加する。

        <section class="game">
            <h2>🎵 リズムゲーム</h2>

            <p>
                音楽に合わせてキーを叩こう。
            </p>

            <a class="play-button" href="games/rhythm/">
                遊ぶ
            </a>
        </section>
        -->

    </main>

    <footer>
        <p>ゲームを少しずつ追加しています。</p>
    </footer>

</body>
</html>
